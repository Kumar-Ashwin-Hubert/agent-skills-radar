# Publishes the weekly Agent Skills Radar report to this repo.
# Triggered by the weekly automation with a repository_dispatch event
# (event type "publish-report") carrying the Markdown files in client_payload.
name: Publish weekly report

on:
  repository_dispatch:
    types: [publish-report]

permissions:
  contents: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write report files from the payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re

          payload = json.loads(os.environ["PAYLOAD"])
          files = payload.get("files") or []
          if not files:
              raise SystemExit("No files in payload")

          # Only these paths may be written by the automation.
          allowed = re.compile(r"^(README\.md|reports/\d{4}-\d{2}-\d{2}\.md)$")
          for f in files:
              path = f["path"]
              if not allowed.match(path):
                  raise SystemExit(f"Refusing to write path: {path}")
              if "content_b64" in f:
                  data = base64.b64decode(f["content_b64"])
              else:
                  data = f["content"].encode("utf-8")
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(f"Wrote {path} ({len(data)} bytes)")
          PY

      - name: Commit and push to main
        env:
          COMMIT_MSG: ${{ github.event.client_payload.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit made."
            exit 0
          fi
          git commit -m "${COMMIT_MSG:-Weekly report update}"
          git push origin HEAD:main
